name: Triunfobet Bot Runner

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 PM UTC (puedes cambiar la hora)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde un botón

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Bot de Triunfobet
        run: python main.py
